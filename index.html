<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1 class="main-title">Find your film</h1>
            <a href="watchlist.html"><h2 class="subtitle">My Watchlist</h2></a>
            <search>
                <form class="search-form">
                    <div class="search-input-wrapper">
                        <img class="search-icon" src="assets/icons/search.png" alt="search" />
                        <input
                            type="search"
                            name="query"
                            placeholder="Search for a movie"
                        />
                    </div> 
                    <button type="submit">Search</button>
                </form>
            </search>
        </header>
        <main>
            <img class="no-data-icon" src="./assets/icons/no-data.png" alt="no data">
        </main>
        <script src="main.js"></script>
    </body>
</html>
